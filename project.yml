name: HeyCapeCod
options:
  bundleIdPrefix: com.heycapecod
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: HeyCapeCod/Info.plist
    CODE_SIGN_ENTITLEMENTS: HeyCapeCod/HeyCapeCod.entitlements
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_PREVIEWS: YES

packages:
  OpenAI:
    url: https://github.com/MacPaw/OpenAI
    from: "0.3.0"

targets:
  HeyCapeCod:
    type: application
    platform: iOS
    sources:
      - path: HeyCapeCod
    resources:
      - path: HeyCapeCod/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heycapecod.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: OpenAI
    info:
      path: HeyCapeCod/Info.plist
    entitlements:
      path: HeyCapeCod/HeyCapeCod.entitlements

  HeyCapeCodTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HeyCapeCodTests
    dependencies:
      - target: HeyCapeCod
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heycapecod.tests

  HeyCapeCodUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HeyCapeCodUITests
    dependencies:
      - target: HeyCapeCod
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heycapecod.uitests

  HeyCapeCodWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HeyCapeCodWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heycapecod.app.widget
        INFOPLIST_KEY_CFBundleDisplayName: Hey Cape Cod Widgets
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  HeyCapeCod:
    build:
      targets:
        HeyCapeCod: all
        HeyCapeCodTests: [test]
        HeyCapeCodUITests: [test]
    run:
      config: Debug
      environmentVariables:
        - variable: OPENAI_API_KEY
          value: ""
          isEnabled: false
    test:
      config: Debug
      targets:
        - HeyCapeCodTests
        - HeyCapeCodUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
