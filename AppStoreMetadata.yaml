# Hey Cape Cod - App Store Connect Metadata
# Use this file to populate App Store Connect fields

app:
  name: "Hey Cape Cod - AI Travel Guide"
  subtitle: "Voice tours, traffic, tides & stories"
  bundle_id: com.heycapecod.app
  sku: HEYCAPECOD001
  primary_category: Travel
  secondary_category: Navigation

  # Version Info
  version: "1.0.0"
  build: 1
  copyright: "2026 Hey Cape Cod LLC"

  # Description (max 4000 characters)
  description: |
    Hey Cape Cod is your AI-powered travel companion for exploring Cape Cod, Massachusetts. Whether you're a first-time visitor or a lifelong local, Hey Cape Cod brings the Cape's rich history, stunning beaches, and hidden gems to life through voice-powered conversations and GPS-triggered audio stories.

    VOICE-POWERED CONVERSATIONS
    Ask anything about Cape Cod and get instant, knowledgeable answers. "What's the best beach for kids today?" "Where should I eat near Chatham?" "Tell me about the Nauset Lighthouse." Your AI guide knows Cape Cod inside and out.

    GPS-TRIGGERED STORIES
    Drive or walk past historic sites, lighthouses, and landmarks to automatically hear fascinating stories tailored to your group. Choose between Kids, Teen, Adult, or Family modes for age-appropriate content that everyone enjoys.

    REAL-TIME BRIDGE & TRAFFIC
    Never get stuck at the bridges again. Live delay times for the Sagamore and Bourne Bridges, plus Route 6 and Route 3 conditions, with smart recommendations on the best time to cross.

    TIDES, WEATHER & BEACH CONDITIONS
    Check tide charts for 7 Cape Cod stations, view live water temperature from NOAA buoys, and get smart beach recommendations based on current wind, waves, and weather conditions. Know exactly which beach to visit today.

    SMART BEACH RECOMMENDATIONS
    Our recommendation engine analyzes wind direction, wave height, tide level, UV index, and crowd patterns across 12 Cape Cod beaches to suggest your perfect beach day.

    EXPLORE THE MAP
    Discover beaches, restaurants, lighthouses, museums, nature trails, and more across all 15 Cape Cod towns. Filter by category, region, or what's nearby.

    FEATURES:
    - Hands-free voice conversations about Cape Cod
    - 50+ GPS-triggered audio stories at landmarks
    - Live Sagamore & Bourne Bridge traffic
    - Tide predictions for 7 stations
    - NOAA buoy data (water temp, waves, wind)
    - Smart beach recommendation engine
    - Interactive map with 100+ points of interest
    - Kids, Teen, Adult, and Family content modes
    - Offline content for areas with poor signal
    - Beautiful design inspired by Cape Cod's landscapes

    PREMIUM ($4.99/month or $29.99/year):
    - Unlimited voice conversations
    - Unlimited GPS stories
    - Offline downloads
    - Ad-free experience
    - Family Sharing support
    - Priority support

    Start with a 7-day free trial. Cancel anytime.

    Built with love on Cape Cod.

  # Keywords (max 100 characters total)
  keywords: "cape cod,travel guide,audio tour,GPS,beach,traffic,tides,AI,family,vacation"

  # What's New (version 1.0.0)
  whats_new: |
    Welcome to Hey Cape Cod! Your AI-powered Cape Cod companion.

    - Voice-powered conversations about Cape Cod
    - GPS-triggered audio stories at 50+ landmarks
    - Live bridge traffic with delay times
    - Tide charts for 7 stations
    - Smart beach recommendations
    - Interactive map with 100+ POIs
    - Kids, Teen, Adult & Family modes
    - Beautiful Cape Cod-inspired design

  # Promotional Text (max 170 characters, can be updated without review)
  promotional_text: "Your AI-powered Cape Cod companion. Voice tours, live traffic, tide charts, and smart beach recommendations. Try free for 7 days!"

  # Support & Marketing URLs
  support_url: "https://heycapecod.com/support"
  marketing_url: "https://heycapecod.com"
  privacy_url: "https://heycapecod.com/privacy"
  terms_url: "https://heycapecod.com/terms"

# Age Rating
