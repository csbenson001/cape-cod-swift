# Privacy Nutrition Labels (App Privacy)
privacy:
  data_types:
    - category: Location
      type: Precise Location
      purpose: App Functionality
      linked_to_identity: false
      used_for_tracking: false
      notes: "Used for GPS-triggered stories and nearby POI recommendations. 'While In Use' for active exploration, 'Always' for background geofence monitoring."

    - category: Location
      type: Coarse Location
      purpose: App Functionality
      linked_to_identity: false
      used_for_tracking: false

    - category: Audio Data
      type: Audio Data
      purpose: App Functionality
      linked_to_identity: false
      used_for_tracking: false
      notes: "Microphone used for voice conversations with AI assistant. Audio is processed in real-time and not stored permanently."

    - category: Purchases
      type: Purchase History
      purpose: App Functionality
      linked_to_identity: true
      used_for_tracking: false
      notes: "Subscription status tracked to manage premium features."

    - category: Identifiers
      type: User ID
      purpose: App Functionality
      linked_to_identity: true
      used_for_tracking: false
      notes: "Firebase Auth user ID for account management and data sync."

    - category: Usage Data
      type: Product Interaction
      purpose: Analytics
      linked_to_identity: false
      used_for_tracking: false
      notes: "Firebase Analytics for feature usage patterns and app improvement."

    - category: Diagnostics
      type: Crash Data
      purpose: App Functionality
      linked_to_identity: false
      used_for_tracking: false

    - category: Diagnostics
      type: Performance Data
      purpose: App Functionality
      linked_to_identity: false
      used_for_tracking: false

